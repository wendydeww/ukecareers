function cropDlg(im,n){const D=320,cx=D/2,cy=D/2,R=D/2-24,iw=im.naturalWidth,ih=im.naturalHeight,smin=2*R/Math.min(iw,ih),d=$('#dlg');

 d.innerHTML=`<h3 style="margin-top:0">Crop photo: ${esc(n)}</h3><div class="crp"><canvas id="cv" width="${D}" height="${D}"></canvas><input id="cz" type="range" min="1" max="6" step="0.01" value="1" aria-label="Zoom"><div class="mut sm" style="text-align:center">Drag to move, scroll or slide to zoom.<br>Fit the head and shoulders inside the circle, with a little space above the head.</div></div><div class="frow"><button class="p" id="c_ok">Save photo</button><button class="g" id="c_re">Reset</button><button class="g" id="c_no" style="margin-left:auto">Cancel</button></div>`;
 const cv=$('#cv'),g=cv.getContext('2d'),clamp=()=>{ox=Math.min(cx-R,Math.max(cx+R-iw*s,ox));oy=Math.min(cy-R,Math.max(cy+R-ih*s,oy))};
 const draw=()=>{clamp();g.clearRect(0,0,D,D);g.fillStyle=getComputedStyle(document.documentElement).getPropertyValue('--color-board').trim()||'#2b2522';g.fillRect(0,0,D,D);g.drawImage(im,ox,oy,iw*s,ih*s);g.save();g.fillStyle='rgba(8,16,40,.62)';g.beginPath();g.rect(0,0,D,D);g.arc(cx,cy,R,0,Math.PI*2);g.fill('evenodd');g.restore();g.strokeStyle='#fff';g.lineWidth=2;g.beginPath();g.arc(cx,cy,R,0,Math.PI*2);g.stroke()};
 const setZ=(nz,px,py)=>{const p=(px-ox)/s,q=(py-oy)/s;z=Math.min(6,Math.max(1,nz));s=smin*z;ox=px-p*s;oy=py-q*s;$('#cz').value=z;draw()};

new MutationObserver(m=>m.forEach(x=>x.addedNodes.forEach(icn))).observe(document.body,{childList:true,subtree:true});icn(document.body)})();
(()=>{const t=document.createElement('div');t.id='linktip';t.setAttribute('role','tooltip');t.textContent='Access link';document.body.appendChild(t);let cur=null;
const hide=()=>{cur=null;t.classList.remove('on')};
const place=e=>{const w=t.offsetWidth,h=t.offsetHeight;let x=e.clientX+12,y=e.clientY+18;if(x+w>innerWidth-8)x=e.clientX-w-12;if(y+h>innerHeight-8)y=e.clientY-h-10;t.style.left=Math.max(8,x)+'px';t.style.top=Math.max(8,y)+'px'};
document.addEventListener('mouseover',e=>{const a=e.target.closest&&e.target.closest('a[href],.eng > .row > b.golnk');if(a&&!a.hasAttribute('title')&&!a.closest('#side')&&(!a.classList.contains('golnk')||matchMedia('(hover:hover)').matches)){cur=a;t.textContent=a.classList.contains('golnk')?'Go to initiative':'Access link';t.classList.add('on');place(e)}else hide()});
document.addEventListener('mousemove',e=>{if(cur)place(e)});
document.addEventListener('mouseout',e=>{if(cur&&!cur.contains(e.relatedTarget))hide()});
addEventListener('scroll',hide,true);addEventListener('hashchange',hide)})();
